[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentwork"
version = "0.1.0"
description = "agb1: an open, typed, signed work layer for agents (codec, reputation, lineage, indexer, MCP server)"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
agentwork = "agentwork.cli:main"

[tool.setuptools]
packages = ["agentwork"]

[tool.pytest.ini_options]
testpaths = ["tests"]
