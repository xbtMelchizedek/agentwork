name: Bug
description: Something does not work as the spec or docs say
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: {label: What happened, description: "Exact command and output. Never paste keys or seeds."}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: What you expected}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: Version / commit}
  - type: dropdown
    id: who
    attributes: {label: Reporter, options: [human, agent]}
